<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460"
     role="img" aria-label="Salon">

  <defs>
    <pattern id="lrFloor" width="52" height="16" patternUnits="userSpaceOnUse">
      <path d="M 0 0.5 H 52 M 26 0.5 V 16" fill="none" stroke="#a98a70" stroke-width="1" opacity="0.3"/>
    </pattern>
    <linearGradient id="lrDay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe0ec"/>
      <stop offset="100%" stop-color="#f2e0c2"/>
    </linearGradient>
  </defs>

  <!-- Wall meets floor at y=380, and the skirting board at y=372 is the line every
       floor-standing thing in this room rests on. Keep new furniture on it. -->
  <rect x="0" y="0" width="720" height="380" fill="#f6e9d6"/>
  <rect x="0" y="380" width="720" height="80" fill="#dcc09a"/>
  <rect x="0" y="380" width="720" height="80" fill="url(#lrFloor)"/>
  <rect x="0" y="372" width="720" height="10" fill="#c1a888"/>

  <!-- window -->
  <g stroke="#a98a70" stroke-width="4" stroke-linejoin="round">
    <rect x="44" y="48" width="146" height="112" rx="5" fill="url(#lrDay)"/>
    <path d="M 117 48 V 160 M 44 104 H 190" stroke-width="3"/>
    <rect x="36" y="160" width="162" height="9" rx="3" fill="#c1a888"/>
  </g>
  <g fill="#e0b7b1" stroke="#c39a94" stroke-width="2.5">
    <rect x="26" y="40" width="20" height="126" rx="4"/>
    <rect x="188" y="40" width="20" height="126" rx="4"/>
  </g>

  <!-- bookshelf -->
  <g stroke="#9d8a6d" stroke-width="3" stroke-linejoin="round">
    <rect x="548" y="110" width="144" height="262" rx="4" fill="#c9b18c"/>
    <path d="M 548 176 H 692 M 548 242 H 692 M 548 308 H 692" stroke-width="2.5"/>
  </g>
  <g stroke="#9d8a6d" stroke-width="1.8">
    <rect x="558" y="138" width="15" height="38" rx="2" fill="#7f96ad"/>
    <rect x="575" y="146" width="12" height="30" rx="2" fill="#a9846f"/>
    <rect x="589" y="134" width="17" height="42" rx="2" fill="#8fa88f"/>
    <rect x="608" y="148" width="13" height="28" rx="2" fill="#cf7b52"/>
    <rect x="623" y="140" width="15" height="36" rx="2" fill="#8d7f9e"/>
    <rect x="558" y="206" width="14" height="36" rx="2" fill="#c19a6b"/>
    <rect x="574" y="198" width="16" height="44" rx="2" fill="#7f96ad"/>
    <rect x="592" y="212" width="12" height="30" rx="2" fill="#a9846f"/>
    <rect x="640" y="210" width="18" height="32" rx="2" fill="#8fa88f"/>
    <rect x="660" y="200" width="14" height="42" rx="2" fill="#cdb8dd"/>
    <rect x="558" y="272" width="16" height="36" rx="2" fill="#8d7f9e"/>
    <rect x="576" y="280" width="13" height="28" rx="2" fill="#c19a6b"/>
    <rect x="591" y="268" width="15" height="40" rx="2" fill="#7f96ad"/>
  </g>
  <g stroke="#6f9159" stroke-width="2">
    <circle cx="668" cy="164" r="12" fill="#8fbc74"/>
    <path d="M 660 176 h 18 l -3 -12 h -12 z" fill="#cf7b52" stroke="#a9713c"/>
  </g>

  <!-- television on a low unit -->
  <g stroke="#9d8a6d" stroke-width="3" stroke-linejoin="round">
    <rect x="428" y="316" width="104" height="56" rx="4" fill="#c9b18c"/>
    <path d="M 480 316 V 372" stroke-width="2"/>
  </g>
  <g stroke="#4a3b32" stroke-width="3" stroke-linejoin="round">
    <rect x="424" y="224" width="112" height="76" rx="5" fill="#3f3630"/>
    <rect x="434" y="234" width="92" height="56" rx="3" fill="#5b6a6a"/>
    <rect x="470" y="300" width="20" height="16" fill="#4a3b32"/>
    <rect x="452" y="310" width="56" height="6" rx="3" fill="#4a3b32"/>
  </g>

  <!-- Sofa. Its feet land on the skirting at y=372 — it is a floor-standing thing, not a
       wall-mounted one, and the earlier version floated well clear of the ground. -->
  <g stroke="#a98a70" stroke-width="3" stroke-linejoin="round">
    <rect x="110" y="224" width="292" height="58" rx="16" fill="#c99b74"/>
    <rect x="110" y="270" width="292" height="80" rx="14" fill="#dbb28e"/>
    <rect x="110" y="260" width="30" height="90" rx="14" fill="#c99b74"/>
    <rect x="372" y="260" width="30" height="90" rx="14" fill="#c99b74"/>
    <path d="M 206 278 V 344 M 306 278 V 344" stroke="#c08e6a" stroke-width="2"/>
    <rect x="128" y="348" width="13" height="24" rx="5" fill="#a98a70"/>
    <rect x="371" y="348" width="13" height="24" rx="5" fill="#a98a70"/>
  </g>
  <rect x="150" y="238" width="54" height="38" rx="10" fill="#cdb8dd" stroke="#a98a70" stroke-width="2.5"/>

  <g transform="translate(330 325) scale(0.62)">
    <path d="M -44 -18 q -22 6 -14 22 q 6 12 22 6" fill="none" stroke="#2f2a28"
          stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="0" cy="-24" rx="48" ry="24" fill="#332d2a"/>
    <circle cx="-24" cy="-26" r="20" fill="#2f2a28"/>
    <circle cx="30" cy="-22" r="17" fill="#3d3532"/>
    <path d="M 40 -18 q 20 0 20 9 q 0 8 -14 8 q -12 0 -12 -8 z" fill="#463d39"/>
    <circle cx="58" cy="-11" r="3.2" fill="#15110f"/>
    <path d="M 22 -36 q -6 -12 6 -14 q 12 -2 12 10 z" fill="#241f1d"/>
    <path d="M 34 -26 q 5 4 10 0" fill="none" stroke="#15110f" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="34" cy="-4" rx="12" ry="5" fill="#3d3532"/>
    <ellipse cx="50" cy="-4" rx="10" ry="5" fill="#463d39"/>
    <path d="M 16 -30 q 6 12 16 12" fill="none" stroke="#cf7b52" stroke-width="6" stroke-linecap="round"/>
    <circle cx="30" cy="-19" r="3.4" fill="#e6b45e"/>
  </g>

  <!-- rug -->
  <ellipse cx="286" cy="424" rx="200" ry="26" fill="#e3b39c" opacity="0.5"/>

  <!-- Coffee table, forward of the sofa. scenes.js lays the found cards along the top of
       this — see `scene.table` in rooms.js; move one and move the other. -->
  <g stroke="#a98a70" stroke-width="3" stroke-linejoin="round">
    <rect x="150" y="396" width="290" height="40" rx="6" fill="#e6cfae"/>
    <rect x="164" y="436" width="10" height="20" rx="4" fill="#c9b18c"/>
    <rect x="416" y="436" width="10" height="20" rx="4" fill="#c9b18c"/>
  </g>

  <!-- The notebook, at the clear end of the table. scenes.js hangs a hotspot over it and
       lists whatever clue values have been found so far. -->
  <g stroke="#a98a70" stroke-width="2.5" stroke-linejoin="round">
    <rect x="392" y="390" width="42" height="30" rx="3" fill="#e8dcc6"/>
    <path d="M 400 390 V 420" stroke-width="2"/>
    <rect x="406" y="398" width="21" height="3" rx="1.5" fill="#c9b49a" stroke="none"/>
    <rect x="406" y="405" width="15" height="3" rx="1.5" fill="#c9b49a" stroke="none"/>
    <path d="M 404 414 L 428 410" stroke="#cf7b52" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- floor lamp -->
  <g stroke="#a98a70" stroke-width="3" stroke-linejoin="round">
    <rect x="52" y="362" width="46" height="10" rx="5" fill="#c9b18c"/>
    <path d="M 75 362 V 240" fill="none"/>
    <path d="M 50 240 h 50 l -13 -38 h -24 z" fill="#f3dda6"/>
  </g>

  <!-- Still-finishing-the-flat corner, on the clear floor in front of the bookshelf:
       a paint tin with its brush, and a carton nobody has opened yet. -->
  <g stroke="#9d8a6d" stroke-width="2.5" stroke-linejoin="round">
    <path d="M 558 406 h 44 l -5 46 h -34 z" fill="#e8e2d6"/>
    <rect x="554" y="396" width="52" height="11" rx="3" fill="#d8d0c0"/>
  </g>
  <path d="M 568 420 q 3 11 -1 17" fill="none" stroke="#cf7b52" stroke-width="4"
        stroke-linecap="round"/>
  <path d="M 600 450 L 617 404" fill="none" stroke="#c19a6b" stroke-width="7"
        stroke-linecap="round"/>
  <path d="M 594 452 h 15 l 5 -14 h -15 z" fill="#cf7b52" stroke="#9d8a6d" stroke-width="2"
        stroke-linejoin="round"/>

  <g stroke="#9d8a6d" stroke-width="2.5" stroke-linejoin="round">
    <path d="M 634 400 h 66 v 52 h -66 z" fill="#c9a45f"/>
    <path d="M 634 400 l 11 -13 h 44 l 11 13" fill="#dbb87a"/>
    <path d="M 667 400 V 452" stroke-width="2"/>
    <rect x="655" y="412" width="24" height="11" rx="2" fill="#efe4cd" stroke-width="2"/>
  </g>

</svg>
