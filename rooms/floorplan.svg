<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 4 762 502" class="floorplan"
     role="img" aria-label="Rzut mieszkania">

  <defs>
    <clipPath id="fpAptClip">
      <rect x="60" y="90" width="690" height="400" rx="8"/>
    </clipPath>

    <pattern id="fpPlanks" width="104" height="36" patternUnits="userSpaceOnUse">
      <path d="M 0 0.5 H 104 M 0 18.5 H 104 M 26 0.5 V 18 M 78 0.5 V 18 M 52 18.5 V 36"
            fill="none" stroke="#b08d63" stroke-width="1" opacity="0.26"/>
    </pattern>
    <pattern id="fpKTiles" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 0 0.5 H 26 M 0.5 0 V 26" fill="none" stroke="#c2a279" stroke-width="1" opacity="0.4"/>
    </pattern>
    <pattern id="fpBTiles" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 0 0.5 H 24 M 0.5 0 V 24" fill="none" stroke="#8fb0ad" stroke-width="1" opacity="0.45"/>
    </pattern>
    <pattern id="fpDeck" width="15" height="15" patternUnits="userSpaceOnUse">
      <path d="M 0.5 0 V 15" fill="none" stroke="#8faa77" stroke-width="1" opacity="0.45"/>
    </pattern>

    <filter id="fpShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- balcony, wrapping around the left + top-left -->
  <g>
    <path d="M 12 18 H 345 V 90 H 60 V 486 H 12 Z" fill="#dbe9cd"/>
    <path d="M 12 18 H 345 V 90 H 60 V 486 H 12 Z" fill="url(#fpDeck)"/>

    <path d="M 345 90 V 18 H 12 V 486 H 60" fill="none" stroke="#7f9a6a" stroke-width="4.5"
          stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 345 90 V 18 H 12 V 486 H 60" fill="none" stroke="#7f9a6a" stroke-width="11"
          stroke-dasharray="2 9" opacity="0.45"/>

    <g stroke="#6f9159" stroke-width="1.4">
      <circle cx="42"  cy="56"  r="12" fill="#8fbc74"/>
      <circle cx="205" cy="56"  r="11" fill="#7fae66"/>
      <circle cx="252" cy="50"  r="8"  fill="#9dc785"/>
      <circle cx="300" cy="58"  r="13" fill="#84b26c"/>
      <circle cx="331" cy="46"  r="7"  fill="#9dc785"/>
      <circle cx="34"  cy="150" r="11" fill="#84b26c"/>
      <circle cx="34"  cy="252" r="9"  fill="#9dc785"/>
      <circle cx="34"  cy="392" r="12" fill="#8fbc74"/>
