    <rect x="410" y="427" width="56" height="13" rx="3" fill="#eab887" stroke="#a9713c" stroke-width="1.3"/>
    <circle cx="438" cy="474" r="7" fill="#fdf6ec" stroke="#a9713c" stroke-width="1.4"/>
    <path d="M 438 474 L 442 470" stroke="#a9713c" stroke-width="1.6" fill="none" stroke-linecap="round"/>

    <!-- main bedroom -->
    <rect x="658" y="328" width="84" height="10"  rx="4" fill="#cbaa8a"/>
    <rect x="658" y="336" width="84" height="106" rx="8" fill="#fdf7ee"/>
    <rect x="665" y="345" width="32" height="19"  rx="6" fill="#ece1d2"/>
    <rect x="703" y="345" width="32" height="19"  rx="6" fill="#ece1d2"/>
    <rect x="658" y="378" width="84" height="64"  rx="8" fill="#e6b0ac" opacity="0.9"/>
    <rect x="630" y="334" width="22" height="22"  rx="3" fill="#cbaa8a"/>
    <!-- the alarm clock: Main Bedroom puzzle prop -->
    <rect x="635" y="339" width="12" height="9"   rx="2" fill="#5c4b40" stroke="#4a3b32"/>
    <rect x="552" y="344" width="22" height="88"  rx="3" fill="#cbaa8a"/>
    <path d="M 563 344 V 432" stroke="#a98a70" stroke-width="1.2" fill="none"/>
    <circle cx="574" cy="462" r="12" fill="#8fbc74" stroke="#6f9159"/>
