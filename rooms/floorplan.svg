    <ellipse cx="95" cy="54" rx="15" ry="11" fill="#e6cfae" stroke="#a98a70" stroke-width="1.6"/>
    <circle cx="95" cy="32" r="7" fill="#dbb28e" stroke="#a98a70" stroke-width="1.4"/>
    <circle cx="95" cy="76" r="7" fill="#dbb28e" stroke="#a98a70" stroke-width="1.4"/>

    <g stroke="#6b5648" stroke-linecap="round" fill="none">
      <path d="M 144 58 L 140 74 M 144 58 L 150 74 M 144 58 L 144 72" stroke-width="2"/>
      <path d="M 136 64 L 157 42" stroke-width="7"/>
    </g>
    <circle cx="158" cy="41" r="3.6" fill="#cfe3e2" stroke="#6b5648" stroke-width="1.4"/>
