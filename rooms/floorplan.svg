    <rect x="142" y="262" width="140" height="38" rx="9" fill="#dbb28e"/>
    <rect x="142" y="262" width="140" height="13" rx="6" fill="#c99b74"/>
    <rect x="142" y="262" width="13"  height="38" rx="6" fill="#c99b74"/>
    <rect x="269" y="262" width="13"  height="38" rx="6" fill="#c99b74"/>
    <path d="M 189 277 V 299 M 236 277 V 299" stroke="#c08e6a" stroke-width="1.3" fill="none"/>

    <rect x="178" y="342" width="68" height="44" rx="9" fill="#e6cfae"/>

    <rect x="300" y="300" width="44" height="42" rx="11" fill="#dbb28e"/>
    <rect x="300" y="300" width="44" height="12" rx="6" fill="#c99b74"/>

