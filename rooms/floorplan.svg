    <path d="M 280 90 V 214"/>
    <path d="M 161 90 L 209 214"/>
    <path d="M 209 214 H 225 M 267 214 H 283"/>
    <path d="M 420 90 V 262"/>
    <path d="M 585 90 V 261"/>
    <path d="M 420 261 H 439 M 480 261 H 608 M 650 261 H 750"/>
    <path d="M 397 316 H 440 M 481 316 H 610 M 651 316 H 750"/>
    <path d="M 397 316 V 490"/>
    <path d="M 547 316 V 490"/>
    <path d="M 309 490 V 360"/>
  </g>

  <!-- doors: leaf + swing arc -->
