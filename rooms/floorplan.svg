    <rect x="70" y="336" width="13" height="44" rx="2" fill="#5c4b40" stroke="#4a3b32"/>

    <rect x="68" y="120" width="42" height="42" rx="11" fill="#dbb28e"/>
    <rect x="68" y="120" width="12" height="42" rx="6" fill="#c99b74"/>
