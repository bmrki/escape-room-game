    <rect x="409" y="329" width="42" height="34" rx="8" fill="#dcecea"/>
    <rect x="500" y="320" width="30" height="10" rx="3" fill="#faf6ef"/>
    <rect x="503" y="328" width="24" height="32" rx="9" fill="#faf6ef"/>
    <rect x="496" y="376" width="34" height="24" rx="7" fill="#faf6ef"/>
    <ellipse cx="513" cy="388" rx="11" ry="7" fill="#dcecea"/>
    <rect x="535" y="372" width="7" height="32" rx="2" fill="#cfe3e2"/>
    <circle cx="416" cy="396" r="10" fill="#8fbc74" stroke="#6f9159"/>

    <!-- the sauna: Bathroom puzzle prop -->
    <rect x="404" y="422" width="68" height="60" rx="6" fill="#dda269" stroke="#a9713c"/>
