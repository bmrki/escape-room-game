    <path d="M 161 90 H 280 V 214 H 209 Z" fill="#dfe8dc"/>
    <rect x="280" y="90"  width="140" height="124" fill="#f7ecdb"/>
    <rect x="420" y="90"  width="165" height="171" fill="#e9e2f1"/>
    <rect x="585" y="90"  width="165" height="171" fill="#dde5ef"/>
    <rect x="397" y="261" width="353" height="55"  fill="#ecd9bd"/>
    <rect x="397" y="316" width="150" height="174" fill="#dbebe9"/>
    <rect x="547" y="316" width="203" height="174" fill="#f6e1dc"/>
    <rect x="309" y="360" width="88"  height="130" fill="#eddfc7"/>

