    <g stroke="#cf7b52">
      <path d="M 225 214 V 172" stroke-width="5"/>
      <path d="M 267 214 A 42 42 0 0 0 225 172" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.65"/>

      <path d="M 439 261 V 220" stroke-width="5"/>
      <path d="M 480 261 A 41 41 0 0 0 439 220" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.65"/>

      <path d="M 608 261 V 219" stroke-width="5"/>
      <path d="M 650 261 A 42 42 0 0 0 608 219" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.65"/>

      <path d="M 481 316 V 357" stroke-width="5"/>
      <path d="M 440 316 A 41 41 0 0 0 481 357" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.65"/>

      <path d="M 610 316 V 357" stroke-width="5"/>
      <path d="M 651 316 A 41 41 0 0 1 610 357" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.65"/>
    </g>

    <g stroke="#4b93b5">
      <path d="M 332 490 V 449" stroke-width="5.5"/>
      <path d="M 373 490 A 41 41 0 0 0 332 449" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>
    </g>
  </g>

  <!-- balcony sliding door, off the kitchen -->
  <g stroke="#7f9a6a" stroke-width="1.6">
    <rect x="291" y="85" width="27" height="10" rx="3" fill="#bcdae6"/>
    <rect x="314" y="85" width="27" height="10" rx="3" fill="#a9cfe0"/>
  </g>

  <!-- fixture labels (room names are drawn by the hit layer in game.js) -->
  <g font-family="'Trebuchet MS', 'Segoe UI', Verdana, sans-serif" text-anchor="middle">
    <g font-size="10.5" letter-spacing="1.4" fill="#96806e">
      <text x="545" y="293">korytarz</text>
      <text x="353" y="400">przedpokój</text>
    </g>
    <text x="438" y="462" font-size="10" letter-spacing="0.6" fill="#8a5327">sauna</text>
  </g>

</svg>