<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460"
     role="img" aria-label="Balkon">

  <defs>
    <linearGradient id="bcSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#9fbdd6"/>
      <stop offset="55%"  stop-color="#e2cfc0"/>
      <stop offset="100%" stop-color="#f6dcb4"/>
    </linearGradient>
    <pattern id="bcDeck" width="720" height="22" patternUnits="userSpaceOnUse">
      <path d="M 0 0.5 H 720" fill="none" stroke="#8f7550" stroke-width="1.4" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- ============================================================
       THE VIEW — this is what they actually see from this balcony:
       allotment gardens immediately below, and the shipyard cranes
       standing over the skyline behind them. Drawn back to front,
       so the railing below covers the lower half of it.
       ============================================================ -->
  <rect x="0" y="0" width="720" height="340" fill="url(#bcSky)"/>
  <circle cx="612" cy="184" r="28" fill="#f7dfa8" opacity="0.8"/>

  <!-- the old town on the far horizon: blocks, a brick tower, a spire -->
  <g fill="#9aa0ad" opacity="0.4">
    <rect x="22" y="218" width="32" height="36"/>
    <rect x="60" y="230" width="24" height="24"/>
    <path d="M 92 254 V 202 h 28 v 52 z"/>
    <path d="M 96 202 v -9 h 5 v 9 z M 106 202 v -9 h 5 v 9 z M 116 202 v -9 h 4 v 9 z"/>
    <rect x="128" y="236" width="28" height="18"/>
    <path d="M 164 254 V 216 l 13 -20 l 13 20 v 38 z"/>
    <rect x="200" y="240" width="38" height="14"/>
  </g>

  <!-- shipyard sheds, long and low -->
  <g fill="#8f96a2" opacity="0.45">
    <rect x="248" y="232" width="196" height="22"/>
    <rect x="452" y="238" width="150" height="16"/>
    <rect x="612" y="234" width="96" height="20"/>
  </g>

  <!-- The cranes. A hammerhead, not a pylon: a lattice tower with a long jib to one side and
       a short counter-jib to the other, a hoist hanging off it. The asymmetry is the whole
       tell — a symmetrical A-frame reads as an electricity pylon instead. -->
  <g stroke="#b5714a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(322 258)">
      <path d="M -7 0 V -66 M 7 0 V -66 M -14 0 H 14 M -7 -66 H 7"/>
      <path d="M -7 -14 L 7 -28 M 7 -14 L -7 -28 M -7 -34 L 7 -48 M 7 -34 L -7 -48"/>
      <path d="M -22 -70 H 58 M 0 -66 V -86 M 0 -86 L -20 -70 M 0 -86 L 54 -70"/>
      <path d="M 42 -70 V -50"/>
      <rect x="37" y="-52" width="10" height="8" fill="#b5714a" stroke="none"/>
    </g>
    <g transform="translate(452 258) scale(0.84)" opacity="0.86">
      <path d="M -7 0 V -66 M 7 0 V -66 M -14 0 H 14 M -7 -66 H 7"/>
      <path d="M -7 -14 L 7 -28 M 7 -14 L -7 -28 M -7 -34 L 7 -48 M 7 -34 L -7 -48"/>
      <path d="M -22 -70 H 58 M 0 -66 V -86 M 0 -86 L -20 -70 M 0 -86 L 54 -70"/>
      <path d="M 42 -70 V -50"/>
      <rect x="37" y="-52" width="10" height="8" fill="#b5714a" stroke="none"/>
    </g>
    <g transform="translate(566 258) scale(0.66)" opacity="0.7">
      <path d="M -7 0 V -66 M 7 0 V -66 M -14 0 H 14 M -7 -66 H 7"/>
      <path d="M -7 -14 L 7 -28 M 7 -14 L -7 -28 M -7 -34 L 7 -48 M 7 -34 L -7 -48"/>
      <path d="M -22 -70 H 58 M 0 -66 V -86 M 0 -86 L -20 -70 M 0 -86 L 54 -70"/>
      <path d="M 42 -70 V -50"/>
      <rect x="37" y="-52" width="10" height="8" fill="#b5714a" stroke="none"/>
    </g>
    <g transform="translate(660 258) scale(0.52)" opacity="0.56">
      <path d="M -7 0 V -66 M 7 0 V -66 M -14 0 H 14 M -7 -66 H 7"/>
      <path d="M -22 -70 H 58 M 0 -66 V -86 M 0 -86 L -20 -70 M 0 -86 L 54 -70"/>
      <path d="M 42 -70 V -50"/>
    </g>
  </g>

  <!-- Allotments, in the middle distance. Warm yellow-green on purpose: the railing in front
       is a cool green, and an allotment band in the same tone merged straight into it. -->
  <rect x="0" y="258" width="720" height="82" fill="#c6cf8b" opacity="0.8"/>
  <g stroke="#a3ac68" stroke-width="1.8" fill="none" opacity="0.75">
    <path d="M 0 284 H 720 M 0 310 H 720"/>
    <path d="M 96 258 V 340 M 244 258 V 340 M 398 258 V 340 M 548 258 V 340 M 664 258 V 340"/>
  </g>
  <g stroke="#8a6a58" stroke-width="1.6">
    <g fill="#e2b48c">
      <rect x="42" y="292" width="26" height="15"/>
      <rect x="302" y="288" width="24" height="14"/>
      <rect x="486" y="296" width="28" height="16"/>
      <rect x="606" y="290" width="22" height="13"/>
    </g>
    <g fill="#c2764a">
      <path d="M 38 292 l 17 -11 l 17 11 z"/>
      <path d="M 298 288 l 16 -10 l 16 10 z"/>
      <path d="M 482 296 l 18 -11 l 18 11 z"/>
      <path d="M 602 290 l 15 -9 l 15 9 z"/>
    </g>
  </g>
  <g fill="#6f9159" opacity="0.9">
    <circle cx="124" cy="298" r="11"/><circle cx="200" cy="312" r="9"/>
    <circle cx="358" cy="302" r="12"/><circle cx="434" cy="292" r="8"/>
    <circle cx="552" cy="308" r="10"/><circle cx="690" cy="298" r="11"/>
  </g>

  <!-- railing -->
  <g fill="#7f9a6a" stroke="#63784f" stroke-width="2">
    <rect x="0" y="248" width="720" height="11" rx="4"/>
    <rect x="0" y="314" width="720" height="9" rx="3"/>
  </g>
  <g fill="#7f9a6a" opacity="0.9">
    <rect x="16"  y="257" width="7" height="58"/><rect x="76"  y="257" width="7" height="58"/>
    <rect x="136" y="257" width="7" height="58"/><rect x="196" y="257" width="7" height="58"/>
    <rect x="256" y="257" width="7" height="58"/><rect x="316" y="257" width="7" height="58"/>
    <rect x="376" y="257" width="7" height="58"/><rect x="436" y="257" width="7" height="58"/>
    <rect x="496" y="257" width="7" height="58"/><rect x="556" y="257" width="7" height="58"/>
    <rect x="616" y="257" width="7" height="58"/><rect x="676" y="257" width="7" height="58"/>
  </g>

  <!-- decking -->
  <rect x="0" y="330" width="720" height="130" fill="#d9bf95"/>
  <rect x="0" y="330" width="720" height="130" fill="url(#bcDeck)"/>
  <rect x="0" y="326" width="720" height="8" rx="3" fill="#b39a76"/>

  <!-- bistro table and chair -->
  <g stroke="#8f7550" stroke-width="2.5" stroke-linejoin="round">
    <ellipse cx="272" cy="352" rx="56" ry="15" fill="#e6cfae"/>
    <rect x="266" y="360" width="11" height="52" fill="#c9b18c"/>
    <ellipse cx="272" cy="414" rx="30" ry="8" fill="#c9b18c"/>
  </g>
  <g stroke="#8f7550" stroke-width="2">
    <path d="M 250 338 h 20 v -16 h -20 z" fill="#e8dcc6"/>
  </g>

  <!-- ============================================================
       THE TELESCOPE — flavour only. Clicking it gives a look at the
       street, not the clue (see `scene.hotspots.telescope`).
       ============================================================ -->
  <g stroke="#6b5648" stroke-width="3" stroke-linejoin="round">
    <path d="M 492 344 L 468 418 M 492 344 L 520 418 M 492 344 L 492 412" fill="none" stroke-width="5"
          stroke-linecap="round"/>
    <path d="M 452 356 L 546 268" fill="none" stroke="#5c4b40" stroke-width="18" stroke-linecap="round"/>
    <path d="M 452 356 L 546 268" fill="none" stroke="#7d6a5c" stroke-width="10" stroke-linecap="round"/>
    <circle cx="550" cy="264" r="9" fill="#cfe3e2"/>
    <circle cx="470" cy="352" r="6" fill="#3f3630"/>
  </g>

  <!-- ============================================================
       THE POTTED PLANT — the Balcony's clue. A note is folded under
       the pot (see `scene.hotspots.plant` in rooms.js).
       ============================================================ -->
  <g>
    <g stroke="#6f9159" stroke-width="2.5">
      <circle cx="112" cy="322" r="24" fill="#84b26c"/>
      <circle cx="160" cy="316" r="20" fill="#7fae66"/>
      <circle cx="136" cy="292" r="27" fill="#8fbc74"/>
      <circle cx="106" cy="288" r="17" fill="#9dc785"/>
    </g>
    <path d="M 100 348 h 76 l -11 62 h -54 z" fill="#cf7b52" stroke="#a9713c" stroke-width="3"
          stroke-linejoin="round"/>
    <rect x="94" y="340" width="88" height="14" rx="4" fill="#dd8f68" stroke="#a9713c" stroke-width="3"/>
    <!-- a corner of paper just showing under the rim -->
    <path d="M 168 404 l 22 6 l -4 10 l -22 -6 z" fill="#fffaf2" stroke="#c9b49a" stroke-width="1.6"/>
  </g>

  <g transform="translate(360 420) scale(0.72)">
    <path d="M -40 -46 q -14 -10 -8 -26" fill="none" stroke="#2f2a28"
          stroke-width="9" stroke-linecap="round"/>
    <rect x="-40" y="-62" width="76" height="38" rx="19" fill="#332d2a"/>
    <rect x="-32" y="-32" width="11" height="32" rx="5.5" fill="#2f2a28"/>
    <rect x="-18" y="-30" width="11" height="30" rx="5.5" fill="#3d3532"/>
    <rect x="14"  y="-32" width="11" height="32" rx="5.5" fill="#2f2a28"/>
    <rect x="27"  y="-30" width="11" height="30" rx="5.5" fill="#3d3532"/>
    <path d="M 24 -58 q 14 -6 20 -14 l 14 10 q -8 12 -22 16 z" fill="#332d2a"/>
    <circle cx="48" cy="-74" r="17" fill="#332d2a"/>
    <path d="M 60 -78 q 19 -2 19 8 q 0 9 -13 9 q -12 0 -12 -8 z" fill="#3d3532"/>
    <circle cx="77" cy="-72" r="3.2" fill="#15110f"/>
    <path d="M 36 -88 q -12 -6 -13 8 q -2 13 11 14 z" fill="#241f1d"/>
    <path d="M 56 -90 q 10 -9 16 2 q 5 11 -6 14 z" fill="#241f1d"/>
    <circle cx="59" cy="-78" r="2.8" fill="#f3e6c8"/>
    <path d="M 33 -60 q 14 8 24 0" fill="none" stroke="#cf7b52" stroke-width="6" stroke-linecap="round"/>
    <circle cx="46" cy="-52" r="3.4" fill="#e6b45e"/>
  </g>

  <!-- a second pot, purely decorative -->
  <g>
    <g stroke="#6f9159" stroke-width="2.5">
      <circle cx="646" cy="352" r="18" fill="#84b26c"/>
      <circle cx="674" cy="346" r="14" fill="#9dc785"/>
    </g>
    <path d="M 630 370 h 62 l -9 44 h -44 z" fill="#c2874a" stroke="#a9713c" stroke-width="3"
          stroke-linejoin="round"/>
  </g>

</svg>
