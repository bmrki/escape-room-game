<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460"
     role="img" aria-label="Jego gabinet">

  <defs>
    <pattern id="hisFloor" width="46" height="14" patternUnits="userSpaceOnUse">
      <path d="M 0 0.5 H 46 M 23 0.5 V 14" fill="none" stroke="#8593a3" stroke-width="1" opacity="0.26"/>
    </pattern>
    <linearGradient id="hisGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d2b26"/>
      <stop offset="100%" stop-color="#101a17"/>
    </linearGradient>
  </defs>

  <!-- wall, floor, baseboard -->
  <rect x="0" y="0" width="720" height="404" fill="#e4ecf4"/>
  <rect x="0" y="404" width="720" height="56" fill="#cbbfa8"/>
  <rect x="0" y="404" width="720" height="56" fill="url(#hisFloor)"/>
  <rect x="0" y="396" width="720" height="10" fill="#b3a68f"/>

  <!-- window -->
  <g stroke="#8a9bad" stroke-width="3" stroke-linejoin="round">
    <rect x="52" y="54" width="140" height="104" rx="5" fill="#cfe0ec"/>
    <path d="M 122 54 V 158 M 52 106 H 192" stroke-width="2.5"/>
    <rect x="44" y="158" width="156" height="9" rx="3" fill="#b3a68f"/>
  </g>

  <!-- shelf of books -->
  <rect x="488" y="96" width="204" height="11" rx="3" fill="#b09a7c" stroke="#8f7c62" stroke-width="2.5"/>
  <g stroke="#8f7c62" stroke-width="1.6">
    <rect x="500" y="52" width="15" height="44" rx="2" fill="#7f96ad"/>
    <rect x="517" y="58" width="12" height="38" rx="2" fill="#a9846f"/>
    <rect x="531" y="50" width="17" height="46" rx="2" fill="#8fa88f"/>
    <rect x="550" y="60" width="13" height="36" rx="2" fill="#c19a6b"/>
    <rect x="565" y="54" width="15" height="42" rx="2" fill="#8d7f9e"/>
    <rect x="584" y="64" width="20" height="32" rx="2" fill="#7f96ad"/>
  </g>

  <!-- desk -->
  <g stroke="#8f7c62" stroke-width="2.5" stroke-linejoin="round">
    <rect x="176" y="300" width="464" height="15" rx="4" fill="#c9b394"/>
    <rect x="196" y="315" width="424" height="81" fill="#b09a7c"/>
    <path d="M 420 315 V 396" stroke-width="2"/>
    <rect x="272" y="340" width="76" height="6" rx="3" fill="#8f7c62" stroke-width="1.4"/>
    <rect x="480" y="340" width="76" height="6" rx="3" fill="#8f7c62" stroke-width="1.4"/>
  </g>

  <!-- ============================================================
       THE TERMINAL — an old CRT. game.js puts a hotspot over the
       screen (see `scene.hotspots.screen` in rooms.js); the working
       terminal itself is the close-up.
       ============================================================ -->
  <g>
    <rect x="286" y="286" width="152" height="16" rx="4" fill="#c8c2b2" stroke="#96907f" stroke-width="2.5"/>
    <rect x="336" y="268" width="52" height="20" fill="#c8c2b2" stroke="#96907f" stroke-width="2.5"/>
    <rect x="258" y="136" width="208" height="140" rx="10" fill="#d5cfbf" stroke="#96907f" stroke-width="3"/>
    <rect x="274" y="150" width="176" height="104" rx="5" fill="url(#hisGlow)" stroke="#6f6a5c" stroke-width="2.5"/>
    <g fill="#5fd39a" opacity="0.85">
      <rect x="286" y="164" width="62" height="4" rx="2"/>
      <rect x="286" y="176" width="94" height="4" rx="2"/>
      <rect x="286" y="196" width="44" height="4" rx="2"/>
      <rect x="286" y="216" width="10" height="9" rx="1"/>
    </g>
    <circle cx="452" cy="266" r="4" fill="#7fc48f"/>
  </g>

  <!-- keyboard and mouse on the desk -->
  <g stroke="#96907f" stroke-width="2" stroke-linejoin="round">
    <rect x="472" y="286" width="118" height="16" rx="4" fill="#c8c2b2"/>
    <g stroke="none" fill="#a19b8c">
      <rect x="480" y="290" width="10" height="4" rx="1"/>
      <rect x="494" y="290" width="10" height="4" rx="1"/>
      <rect x="508" y="290" width="10" height="4" rx="1"/>
      <rect x="522" y="290" width="10" height="4" rx="1"/>
      <rect x="536" y="290" width="10" height="4" rx="1"/>
      <rect x="550" y="290" width="10" height="4" rx="1"/>
      <rect x="486" y="296" width="60" height="4" rx="2"/>
    </g>
    <ellipse cx="612" cy="294" rx="13" ry="8" fill="#c8c2b2"/>
  </g>

  <!-- mug and sticky notes -->
  <g stroke="#8f7c62" stroke-width="2" stroke-linejoin="round">
    <rect x="200" y="278" width="26" height="24" rx="3" fill="#7f96ad"/>
    <path d="M 226 284 a 7 7 0 0 1 0 12" fill="none"/>
    <rect x="238" y="288" width="18" height="14" rx="2" fill="#f2e08a"/>
  </g>

  <!-- tower on the floor -->
  <g stroke="#8f7c62" stroke-width="2.5" stroke-linejoin="round">
    <rect x="646" y="248" width="56" height="148" rx="5" fill="#b7b1a2"/>
    <rect x="656" y="262" width="36" height="5" rx="2" fill="#8f8a7d"/>
    <rect x="656" y="274" width="36" height="5" rx="2" fill="#8f8a7d"/>
    <circle cx="662" cy="296" r="4" fill="#7fc48f"/>
  </g>

  <g transform="translate(600 450) scale(0.72)">
    <path d="M -22 -26 q -20 -2 -18 -22 q 1 -9 9 -9" fill="none" stroke="#2f2a28"
          stroke-width="9" stroke-linecap="round"/>
    <circle cx="-8" cy="-24" r="24" fill="#2f2a28"/>
    <path d="M 2 -66 q 22 2 22 30 q 0 22 -8 36 h -22 q -6 -30 -4 -46 z" fill="#332d2a"/>
    <rect x="4"  y="-26" width="11" height="26" rx="5.5" fill="#2f2a28"/>
    <rect x="17" y="-24" width="11" height="24" rx="5.5" fill="#3d3532"/>
    <ellipse cx="9.5" cy="-1" rx="7" ry="4" fill="#3d3532"/>
    <ellipse cx="22.5" cy="-1" rx="7" ry="4" fill="#463d39"/>
    <circle cx="16" cy="-78" r="18" fill="#332d2a"/>
    <path d="M 28 -82 q 20 -2 20 8 q 0 9 -14 9 q -12 0 -12 -8 z" fill="#3d3532"/>
    <circle cx="46" cy="-76" r="3.4" fill="#15110f"/>
    <path d="M 4 -92 q -12 -6 -14 8 q -2 14 12 15 z" fill="#241f1d"/>
    <path d="M 24 -94 q 10 -9 16 2 q 5 11 -6 14 z" fill="#241f1d"/>
    <circle cx="27" cy="-82" r="2.8" fill="#f3e6c8"/>
    <path d="M 3 -62 q 16 9 28 1" fill="none" stroke="#cf7b52" stroke-width="6" stroke-linecap="round"/>
    <circle cx="18" cy="-55" r="3.6" fill="#e6b45e"/>
  </g>

  <!-- floor plant -->
  <g stroke="#6f9159" stroke-width="2">
    <path d="M 78 396 h 52 l -7 -32 h -38 z" fill="#a9846f" stroke="#8a6a58"/>
    <circle cx="86"  cy="348" r="15" fill="#8fbc74"/>
    <circle cx="122" cy="342" r="13" fill="#7fae66"/>
    <circle cx="104" cy="328" r="18" fill="#84b26c"/>
  </g>

</svg>
