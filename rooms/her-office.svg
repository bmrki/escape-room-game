<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460"
     role="img" aria-label="Jej gabinet">

  <defs>
    <pattern id="hoFloor" width="46" height="14" patternUnits="userSpaceOnUse">
      <path d="M 0 0.5 H 46 M 23 0.5 V 14" fill="none" stroke="#8fa383" stroke-width="1" opacity="0.28"/>
    </pattern>
  </defs>

  <!-- wall, floor, baseboard -->
  <rect x="0" y="0" width="720" height="404" fill="#eaf0e2"/>
  <rect x="0" y="404" width="720" height="56" fill="#d5c3a2"/>
  <rect x="0" y="404" width="720" height="56" fill="url(#hoFloor)"/>
  <rect x="0" y="396" width="720" height="10" fill="#bda98a"/>

  <!-- ============================================================
       PERIODIC TABLE POSTER — the lookup step. game.js puts a
       hotspot over this (see `scene.hotspots.poster` in rooms.js);
       the readable table is drawn in the close-up.
       ============================================================ -->
  <g>
    <rect x="36" y="56" width="228" height="176" rx="4" fill="#fffaf2" stroke="#9d8a6d" stroke-width="4"/>
    <rect x="48" y="68" width="204" height="22" rx="3" fill="#7fa88e"/>
    <g fill="#c8dbcd" stroke="#a9c4b4" stroke-width="0.8">
      <rect x="48"  y="100" width="16" height="16" rx="2"/>
      <rect x="236" y="100" width="16" height="16" rx="2"/>
      <rect x="48"  y="120" width="16" height="16" rx="2"/><rect x="66" y="120" width="16" height="16" rx="2"/>
      <rect x="146" y="120" width="16" height="16" rx="2"/><rect x="164" y="120" width="16" height="16" rx="2"/>
      <rect x="182" y="120" width="16" height="16" rx="2"/><rect x="200" y="120" width="16" height="16" rx="2"/>
      <rect x="218" y="120" width="16" height="16" rx="2"/><rect x="236" y="120" width="16" height="16" rx="2"/>
      <rect x="48"  y="140" width="16" height="16" rx="2"/><rect x="66" y="140" width="16" height="16" rx="2"/>
      <rect x="146" y="140" width="16" height="16" rx="2"/><rect x="164" y="140" width="16" height="16" rx="2"/>
      <rect x="182" y="140" width="16" height="16" rx="2"/><rect x="200" y="140" width="16" height="16" rx="2"/>
      <rect x="218" y="140" width="16" height="16" rx="2"/><rect x="236" y="140" width="16" height="16" rx="2"/>
    </g>
    <g fill="#e4b9a3" stroke="#c99b83" stroke-width="0.8">
      <rect x="48"  y="160" width="16" height="16" rx="2"/><rect x="66"  y="160" width="16" height="16" rx="2"/>
      <rect x="84"  y="160" width="16" height="16" rx="2"/><rect x="102" y="160" width="16" height="16" rx="2"/>
      <rect x="120" y="160" width="16" height="16" rx="2"/><rect x="138" y="160" width="16" height="16" rx="2"/>
      <rect x="156" y="160" width="16" height="16" rx="2"/><rect x="174" y="160" width="16" height="16" rx="2"/>
      <rect x="192" y="160" width="16" height="16" rx="2"/><rect x="210" y="160" width="16" height="16" rx="2"/>
      <rect x="228" y="160" width="16" height="16" rx="2"/>
    </g>
    <g fill="#cbb9a4">
      <rect x="48" y="192" width="120" height="5" rx="2.5"/>
      <rect x="48" y="204" width="86"  height="5" rx="2.5"/>
    </g>
  </g>

  <!-- shelf the jars stand on (the jars themselves are drawn by scenes.js) -->
  <rect x="300" y="212" width="392" height="12" rx="3" fill="#c3a882" stroke="#9d8a6d" stroke-width="2.5"/>
  <rect x="316" y="224" width="10" height="16" rx="2" fill="#b39a76"/>
  <rect x="666" y="224" width="10" height="16" rx="2" fill="#b39a76"/>

  <!-- desk -->
  <g stroke="#9d8a6d" stroke-width="2.5" stroke-linejoin="round">
    <rect x="286" y="316" width="420" height="15" rx="4" fill="#d9bf95"/>
    <rect x="306" y="331" width="380" height="66" fill="#c3a882"/>
    <path d="M 496 331 V 397" stroke-width="2"/>
    <rect x="360" y="352" width="72" height="6" rx="3" fill="#a08d70" stroke-width="1.4"/>
    <rect x="550" y="352" width="72" height="6" rx="3" fill="#a08d70" stroke-width="1.4"/>
  </g>

  <!-- desk lamp -->
  <g stroke="#9d8a6d" stroke-width="2.5" stroke-linejoin="round" fill="#a9c4b4">
    <rect x="620" y="308" width="52" height="9" rx="4"/>
    <path d="M 646 308 V 268" fill="none"/>
    <path d="M 622 268 h 48 l -12 -22 h -24 z"/>
  </g>

  <!-- notebook on the desk -->
  <g stroke="#9d8a6d" stroke-width="2" stroke-linejoin="round">
    <rect x="316" y="298" width="72" height="18" rx="3" fill="#fffaf2"/>
    <path d="M 316 306 H 388" stroke-width="1.2"/>
  </g>

  <!-- a plain mug on the desk — same 26x24 body and handle as the one in his-office.svg,
       in her room's terracotta instead of his blue. It rests on the desk top at y=316, and
       stops well short of x=455 where the beaker's clear area begins. Nothing is written
       on it: the joke is in what clicking it says. -->
  <g stroke="#9d8a6d" stroke-width="2" stroke-linejoin="round">
    <rect x="404" y="292" width="26" height="24" rx="3" fill="#cf7b52"/>
    <path d="M 429 300 H 432 a 7 7 0 0 1 0 12 H 429" fill="none"/>
  </g>

  <!-- floor plant -->
  <g stroke="#6f9159" stroke-width="2">
    <path d="M 120 396 h 56 l -8 -34 h -40 z" fill="#cf7b52" stroke="#a9713c"/>
    <circle cx="128" cy="344" r="16" fill="#8fbc74"/>
    <circle cx="166" cy="338" r="14" fill="#7fae66"/>
    <circle cx="148" cy="322" r="19" fill="#84b26c"/>
  </g>

  <g transform="translate(210 444) scale(0.72)">
    <path d="M -44 -18 q -22 6 -14 22 q 6 12 22 6" fill="none" stroke="#2f2a28"
          stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="0" cy="-24" rx="48" ry="24" fill="#332d2a"/>
    <circle cx="-24" cy="-26" r="20" fill="#2f2a28"/>
    <circle cx="30" cy="-22" r="17" fill="#3d3532"/>
    <path d="M 40 -18 q 20 0 20 9 q 0 8 -14 8 q -12 0 -12 -8 z" fill="#463d39"/>
    <circle cx="58" cy="-11" r="3.2" fill="#15110f"/>
    <path d="M 22 -36 q -6 -12 6 -14 q 12 -2 12 10 z" fill="#241f1d"/>
    <path d="M 34 -26 q 5 4 10 0" fill="none" stroke="#15110f" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="34" cy="-4" rx="12" ry="5" fill="#3d3532"/>
    <ellipse cx="50" cy="-4" rx="10" ry="5" fill="#463d39"/>
    <path d="M 16 -30 q 6 12 16 12" fill="none" stroke="#cf7b52" stroke-width="6" stroke-linecap="round"/>
    <circle cx="30" cy="-19" r="3.4" fill="#e6b45e"/>
  </g>

  <!-- The desk area from x 455..550, y 240..316 is deliberately left clear:
       scenes.js draws the beaker there. -->

</svg>
