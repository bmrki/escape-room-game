<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460"
     role="img" aria-label="Sypialnia">

  <defs>
    <pattern id="mbFloor" width="48" height="15" patternUnits="userSpaceOnUse">
      <path d="M 0 0.5 H 48 M 24 0.5 V 15" fill="none" stroke="#a98a70" stroke-width="1" opacity="0.3"/>
    </pattern>
    <linearGradient id="mbNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#31405c"/>
      <stop offset="100%" stop-color="#6d6079"/>
    </linearGradient>
  </defs>

  <!-- wall, floor, skirting -->
  <rect x="0" y="0" width="720" height="404" fill="#f4e2de"/>
  <rect x="0" y="404" width="720" height="56" fill="#dcc5a6"/>
  <rect x="0" y="404" width="720" height="56" fill="url(#mbFloor)"/>
  <rect x="0" y="396" width="720" height="10" fill="#c1a888"/>

  <!-- window with the night outside -->
  <g stroke="#b08d70" stroke-width="4" stroke-linejoin="round">
    <rect x="44" y="52" width="152" height="116" rx="5" fill="url(#mbNight)"/>
    <path d="M 120 52 V 168 M 44 110 H 196" stroke-width="3"/>
  </g>
  <g fill="#f3ecd2" opacity="0.85">
    <circle cx="86" cy="82" r="2"/><circle cx="152" cy="74" r="2.4"/>
    <circle cx="170" cy="132" r="2"/><circle cx="70" cy="140" r="1.8"/>
    <circle cx="166" cy="96" r="9"/>
  </g>
  <g fill="#e0b7b1" stroke="#c39a94" stroke-width="2.5">
    <rect x="30" y="44" width="22" height="132" rx="4"/>
    <rect x="188" y="44" width="22" height="132" rx="4"/>
    <rect x="24" y="38" width="192" height="10" rx="5"/>
  </g>

  <!-- bed -->
  <g stroke="#a98a70" stroke-width="3" stroke-linejoin="round">
    <rect x="308" y="146" width="330" height="104" rx="12" fill="#c8a98b"/>
    <rect x="322" y="160" width="302" height="76" rx="8" fill="#d7bb9c"/>
    <rect x="300" y="250" width="346" height="146" rx="10" fill="#fdf7ee"/>
    <rect x="326" y="262" width="126" height="46" rx="12" fill="#ece1d2"/>
    <rect x="466" y="262" width="126" height="46" rx="12" fill="#ece1d2"/>
    <rect x="300" y="318" width="346" height="78" rx="10" fill="#e6b0ac"/>
    <path d="M 300 340 H 646" stroke="#cf9a95" stroke-width="2.5"/>
  </g>

  <!-- nightstand -->
  <g stroke="#a98a70" stroke-width="3" stroke-linejoin="round">
    <rect x="176" y="286" width="116" height="14" rx="4" fill="#c8a98b"/>
    <rect x="186" y="300" width="96" height="96" fill="#b99a7c"/>
    <path d="M 186 348 H 282" stroke-width="2.5"/>
    <rect x="214" y="318" width="40" height="6" rx="3" fill="#95795f" stroke-width="1.4"/>
    <rect x="214" y="366" width="40" height="6" rx="3" fill="#95795f" stroke-width="1.4"/>
  </g>

  <!-- ============================================================
       THE ALARM CLOCK. game.js puts a hotspot over it (see
       `scene.hotspots.clock` in rooms.js); the settable face is the
       close-up, because the time comes from PERSONALIZATION.
       ============================================================ -->
  <g>
    <rect x="196" y="240" width="78" height="46" rx="7" fill="#5c4b40" stroke="#4a3b32" stroke-width="3"/>
    <rect x="206" y="250" width="58" height="26" rx="4" fill="#241a16"/>
    <g fill="#e0523c">
      <rect x="212" y="258" width="10" height="4" rx="1.5"/>
      <rect x="226" y="258" width="10" height="4" rx="1.5"/>
      <rect x="242" y="258" width="10" height="4" rx="1.5"/>
      <rect x="256" y="258" width="4"  height="4" rx="1.5"/>
      <rect x="212" y="266" width="10" height="4" rx="1.5"/>
      <rect x="226" y="266" width="10" height="4" rx="1.5"/>
      <rect x="242" y="266" width="10" height="4" rx="1.5"/>
    </g>
    <rect x="222" y="232" width="26" height="8" rx="4" fill="#7d6a5c" stroke="#4a3b32" stroke-width="2"/>
  </g>

  <!-- floor lamp on the far side of the bed -->
  <g stroke="#a98a70" stroke-width="3" stroke-linejoin="round">
    <rect x="660" y="384" width="46" height="10" rx="5" fill="#b99a7c"/>
    <path d="M 683 384 V 268" fill="none"/>
    <path d="M 658 268 h 50 l -13 -36 h -24 z" fill="#f3dda6"/>
  </g>

  <!-- rug -->
  <ellipse cx="400" cy="428" rx="176" ry="26" fill="#e3b39c" opacity="0.55"/>

  <g transform="translate(480 442) scale(0.72)">
    <path d="M -44 -18 q -22 6 -14 22 q 6 12 22 6" fill="none" stroke="#2f2a28"
          stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="0" cy="-24" rx="48" ry="24" fill="#332d2a"/>
    <circle cx="-24" cy="-26" r="20" fill="#2f2a28"/>
    <circle cx="30" cy="-22" r="17" fill="#3d3532"/>
    <path d="M 40 -18 q 20 0 20 9 q 0 8 -14 8 q -12 0 -12 -8 z" fill="#463d39"/>
    <circle cx="58" cy="-11" r="3.2" fill="#15110f"/>
    <path d="M 22 -36 q -6 -12 6 -14 q 12 -2 12 10 z" fill="#241f1d"/>
    <path d="M 34 -26 q 5 4 10 0" fill="none" stroke="#15110f" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="34" cy="-4" rx="12" ry="5" fill="#3d3532"/>
    <ellipse cx="50" cy="-4" rx="10" ry="5" fill="#463d39"/>
    <path d="M 16 -30 q 6 12 16 12" fill="none" stroke="#cf7b52" stroke-width="6" stroke-linecap="round"/>
    <circle cx="30" cy="-19" r="3.4" fill="#e6b45e"/>
  </g>

</svg>
