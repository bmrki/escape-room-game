<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460"
     role="img" aria-label="Kuchnia">

  <defs>
    <pattern id="kFloor" width="46" height="14" patternUnits="userSpaceOnUse">
      <path d="M 0 0.5 H 46 M 23 0.5 V 14" fill="none" stroke="#b08d63" stroke-width="1" opacity="0.3"/>
    </pattern>
    <linearGradient id="kDaylight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcf0f6"/>
      <stop offset="100%" stop-color="#f6e7c8"/>
    </linearGradient>
  </defs>

  <!-- wall, floor, baseboard -->
  <rect x="0" y="0" width="720" height="404" fill="#f3e6d2"/>
  <rect x="0" y="404" width="720" height="56" fill="#e0c49b"/>
  <rect x="0" y="404" width="720" height="56" fill="url(#kFloor)"/>
  <rect x="0" y="396" width="720" height="10" fill="#cbaa8a"/>

  <!-- rug -->
  <ellipse cx="300" cy="432" rx="150" ry="21" fill="#e3b39c" opacity="0.55"/>

  <!-- window over the little side table -->
  <g stroke="#a98a70" stroke-width="3" stroke-linejoin="round">
    <rect x="545" y="28" width="130" height="80" rx="5" fill="url(#kDaylight)"/>
    <path d="M 610 28 V 108 M 545 68 H 675" stroke-width="2.5"/>
    <rect x="537" y="108" width="146" height="9" rx="3" fill="#cbaa8a"/>
  </g>
  <g stroke="#6f9159" stroke-width="1.4">
    <circle cx="560" cy="98" r="10" fill="#8fbc74"/>
  </g>

  <!-- fridge -->
  <g stroke="#a98a70" stroke-width="3" stroke-linejoin="round">
    <rect x="25" y="110" width="120" height="288" rx="8" fill="#f2ece2"/>
    <path d="M 25 232 H 145" stroke-width="2"/>
    <rect x="126" y="152" width="7" height="48" rx="3" fill="#b6a495" stroke-width="1.5"/>
    <rect x="126" y="252" width="7" height="48" rx="3" fill="#b6a495" stroke-width="1.5"/>
  </g>
  <g stroke="none">
    <circle cx="58" cy="150" r="6" fill="#cf7b52"/>
    <circle cx="76" cy="166" r="5" fill="#8fbc74"/>
    <rect x="50" y="182" width="30" height="22" rx="2" fill="#fffaf2" stroke="#cbb9a4" stroke-width="1.5"/>
  </g>

  <!-- upper cabinets -->
  <g stroke="#a98a70" stroke-width="2.5" stroke-linejoin="round">
    <rect x="165" y="48" width="150" height="104" rx="4" fill="#d9b98f"/>
    <path d="M 240 48 V 152" stroke-width="2"/>
    <rect x="228" y="92" width="5" height="20" rx="2" fill="#b6a495" stroke-width="1.2"/>
    <rect x="247" y="92" width="5" height="20" rx="2" fill="#b6a495" stroke-width="1.2"/>
  </g>

  <!-- open shelf with jars and mugs -->
  <g stroke="#a98a70" stroke-width="2" stroke-linejoin="round">
    <rect x="335" y="128" width="150" height="10" rx="3" fill="#cbaa8a"/>
    <rect x="346" y="100" width="22" height="28" rx="3" fill="#e8dcc6"/>
    <rect x="346" y="100" width="22" height="7" rx="3" fill="#cf7b52" stroke="none"/>
