    <path d="M 447 212 a 10 10 0 0 1 20 0" fill="none" stroke-width="2.5"/>
  </g>

  <!-- Flat-pack cabinet leaning in the gap between the counter (ends x=485) and the side
       table (starts x=541). Stops short of x=539, where the calendar's hit area begins. -->
  <g stroke="#8a6a3a" stroke-width="2.5" stroke-linejoin="round">
    <path d="M 494 396 L 500 242 L 534 238 L 532 396 Z" fill="#c9a45f"/>
    <path d="M 500 242 L 534 238" stroke-width="2"/>
    <rect x="504" y="292" width="24" height="16" rx="2" fill="#efe4cd" stroke-width="2"/>
    <path d="M 497 330 L 533 327" stroke-width="2" opacity="0.55"/>
  </g>

  <!-- side table under the window -->
  <g stroke="#a98a70" stroke-width="2.5" stroke-linejoin="round">
    <rect x="545" y="330" width="130" height="12" rx="3" fill="#cbaa8a"/>
    <rect x="553" y="342" width="9" height="54" rx="2" fill="#cbaa8a"/>
    <rect x="658" y="342" width="9" height="54" rx="2" fill="#cbaa8a"/>
