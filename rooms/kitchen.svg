      <rect x="587" y="212" width="7" height="3" rx="1.5"/>
      <rect x="605" y="212" width="7" height="3" rx="1.5"/>
      <rect x="623" y="212" width="7" height="3" rx="1.5"/>
      <rect x="641" y="212" width="7" height="3" rx="1.5"/>
      <rect x="659" y="212" width="7" height="3" rx="1.5"/>
      <rect x="551" y="232" width="7" height="3" rx="1.5"/>
      <rect x="569" y="232" width="7" height="3" rx="1.5"/>
      <rect x="587" y="232" width="7" height="3" rx="1.5"/>
      <rect x="605" y="232" width="7" height="3" rx="1.5"/>
      <rect x="623" y="232" width="7" height="3" rx="1.5"/>
      <rect x="641" y="232" width="7" height="3" rx="1.5"/>
      <rect x="659" y="232" width="7" height="3" rx="1.5"/>
      <rect x="551" y="252" width="7" height="3" rx="1.5"/>
      <rect x="569" y="252" width="7" height="3" rx="1.5"/>
      <rect x="587" y="252" width="7" height="3" rx="1.5"/>
      <rect x="605" y="252" width="7" height="3" rx="1.5"/>
      <rect x="623" y="252" width="7" height="3" rx="1.5"/>
      <rect x="641" y="252" width="7" height="3" rx="1.5"/>
      <rect x="659" y="252" width="7" height="3" rx="1.5"/>
      <rect x="551" y="272" width="7" height="3" rx="1.5"/>
      <rect x="569" y="272" width="7" height="3" rx="1.5"/>
      <rect x="587" y="272" width="7" height="3" rx="1.5"/>
      <rect x="605" y="272" width="7" height="3" rx="1.5"/>
    </g>
