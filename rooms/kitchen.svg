    <path d="M 432 118 a 5 5 0 0 1 0 8" fill="none"/>
    <path d="M 446 114 h 20 v 14 h -20 z" fill="#cdb8dd"/>
    <path d="M 466 118 a 5 5 0 0 1 0 8" fill="none"/>
  </g>

  <!-- counter -->
  <g stroke="#a98a70" stroke-width="2.5" stroke-linejoin="round">
    <rect x="155" y="248" width="330" height="16" rx="4" fill="#e6cfae"/>
    <rect x="155" y="264" width="330" height="132" fill="#cbaa8a"/>
    <path d="M 235 264 V 396" stroke-width="2"/>
    <rect x="222" y="300" width="5" height="22" rx="2" fill="#b6a495" stroke-width="1.2"/>
    <rect x="243" y="300" width="5" height="22" rx="2" fill="#b6a495" stroke-width="1.2"/>
  </g>

  <!-- sink + faucet -->
  <rect x="178" y="250" width="86" height="12" rx="3" fill="#f2ece2" stroke="#a98a70" stroke-width="1.6"/>
  <path d="M 215 248 V 216 Q 215 206 227 206 H 248 V 218" fill="none" stroke="#b6a495"
        stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- stove -->
  <g stroke="#a98a70" stroke-width="2.5" stroke-linejoin="round">
    <rect x="315" y="264" width="110" height="132" fill="#e9dfd0"/>
    <rect x="322" y="292" width="96" height="8" rx="4" fill="#b6a495" stroke-width="1.5"/>
    <rect x="328" y="312" width="84" height="62" rx="6" fill="#b9a894"/>
    <rect x="336" y="320" width="68" height="46" rx="4" fill="#8f8175" stroke="none"/>
  </g>
  <g fill="#b6a495" stroke="#8a7263" stroke-width="1.4">
